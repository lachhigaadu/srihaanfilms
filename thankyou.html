<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | SRIHAANFILMS</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:#000;
      color:#fff;
      overflow:hidden;
    }

    .thankyou-section{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
      background:
      linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
      url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2000&auto=format&fit=crop');

      background-size:cover;
      background-position:center;
    }

    .thankyou-section::before{
      content:'';
      position:absolute;
      width:500px;
      height:500px;
      background:#fd8650;
      filter:blur(180px);
      opacity:0.18;
      right:-100px;
      top:-100px;
      border-radius:50%;
    }

    .thankyou-box{
      position:relative;
      z-index:2;
      background:rgba(17,17,17,0.85);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(15px);
      padding:70px 50px;
      border-radius:35px;
      text-align:center;
      max-width:750px;
      width:90%;
      box-shadow:0 20px 50px rgba(0,0,0,0.5);
    }

    .success-icon{
      width:120px;
      height:120px;
      background:rgba(253,134,80,0.15);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:auto;
      margin-bottom:35px;
    }

    .success-icon i{
      font-size:4rem;
      color:#fd8650;
    }

    .thankyou-box h1{
      font-size:4rem;
      font-weight:800;
      margin-bottom:20px;
    }

    .orange{
      color:#fd8650;
    }

    .thankyou-box p{
      color:#d1d1d1;
      line-height:2;
      font-size:1.1rem;
      margin-bottom:40px;
    }

    .btn-home{
      background:#fd8650;
      color:#fff;
      padding:16px 45px;
      border-radius:18px;
      text-decoration:none;
      font-weight:600;
      transition:0.4s;
      display:inline-block;
    }

    .btn-home:hover{
      background:#ff6b2d;
      transform:translateY(-5px);
      color:#fff;
    }

    .social-links{
      margin-top:40px;
    }

    .social-links a{
      width:50px;
      height:50px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:rgba(255,255,255,0.08);
      color:#fff;
      margin:0 8px;
      transition:0.4s;
      text-decoration:none;
    }

    .social-links a:hover{
      background:#fd8650;
      transform:translateY(-5px);
    }

    @media(max-width:768px){

      .thankyou-box{
        padding:50px 25px;
      }

      .thankyou-box h1{
        font-size:2.5rem;
      }

      .thankyou-box p{
        font-size:1rem;
      }

    }

  </style>
  <style>
  /* Disable text selection across the entire website via CSS */
  body {
    -webkit-touch-callout: none; /* iOS Safari */
    -webkit-user-select: none;   /* Safari */
    -khtml-user-select: none;     /* Konqueror HTML */
    -moz-user-select: none;      /* Firefox */
    -ms-user-select: none;       /* Internet Explorer/Edge */
    user-select: none;           /* Non-prefixed version, currently supported by Chrome, Opera, and Edge */
  }
</style>

<script>
  // 1. Disable Right-Click (Context Menu)
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // 2. Disable Key Combinations (Ctrl+U, Ctrl+C, Ctrl+S, Ctrl+Shift+I, F12)
  document.addEventListener('keydown', function(e) {
    
    // Check if Ctrl key (or Cmd key on Mac) is pressed
    const isCtrl = e.ctrlKey || e.metaKey;

    // Block Ctrl + U (View Source)
    if (isCtrl && e.key.toLowerCase() === 'u') {
      e.preventDefault();
      return false;
    }

    // Block Ctrl + C (Copy)
    if (isCtrl && e.key.toLowerCase() === 'c') {
      e.preventDefault();
      return false;
    }

    // Block Ctrl + S (Save Page)
    if (isCtrl && e.key.toLowerCase() === 's') {
      e.preventDefault();
      return false;
    }

    // Block Ctrl + Shift + I (Developer Tools)
    if (isCtrl && e.shiftKey && e.key.toLowerCase() === 'i') {
      e.preventDefault();
      return false;
    }

    // Block F12 (Developer Tools)
    if (e.key === 'F12') {
      e.preventDefault();
      return false;
    }
  });

  // 3. Extra safeguard to completely kill the "copy" command event
  document.addEventListener('copy', function(e) {
    e.preventDefault();
  });
</script>

</head>
<body>

<!-- Thank You Section -->

<section class="thankyou-section">

  <div class="thankyou-box">

    <div class="success-icon">
      <i class="fa-solid fa-circle-check"></i>
    </div>

    <h1>
      Thank <span class="orange">You!</span>
    </h1>

    <p>
      Your audition form has been submitted successfully to SRIHAANFILMS.  
      Our casting team will review your application and contact you if shortlisted for upcoming films, web series, or cinematic projects.
    </p>

    <a href="index.html" class="btn-home">
      Back To Home
    </a>

    <!-- Social -->

    <div class="social-links">

      <a href="#">
        <i class="fab fa-instagram"></i>
      </a>

      <a href="#">
        <i class="fab fa-youtube"></i>
      </a>

      <a href="#">
        <i class="fab fa-facebook-f"></i>
      </a>

      <a href="#">
        <i class="fab fa-x-twitter"></i>
      </a>

    </div>

  </div>

</section>

</body>
</html>
