<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Audition Application Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    padding:40px 20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#1a1a1a;
    padding:40px;
    border-radius:20px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#ff9059;
    font-size:40px;
}

h2{
    margin:30px 0 20px;
    color:#ff9059;
    border-bottom:1px solid #333;
    padding-bottom:10px;
}

.input-box{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:15px;
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2b2b2b;
    color:white;
    font-size:15px;
}

textarea{
    resize:none;
    height:120px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#ff9059;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:30px;
}

button:hover{
    opacity:0.9;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:20px;
}

.checkbox input{
    width:auto;
}

@media(max-width:768px){

.row{
    grid-template-columns:1fr;
}

.container{
    padding:20px;
}

}
 
</style>
</head>
<body>

<div class="container">

<h1>Movie Audition Application Form</h1>

<form action="https://api.web3forms.com/submit" method="POST" enctype="multipart/form-data">

<input type="hidden" name="access_key" value="75fba7b6-743f-4c2d-8346-f4f0a4e94e41">

<input type="hidden" name="redirect" value="https://www.srihaanfilms.com/thankyou.html">

<!-- PERSONAL DETAILS -->

<h2>Personal Details</h2>

<div class="row">

<div class="input-box">
<label>Full Name</label>
<input type="text" name="Full Name" required>
</div>

<div class="input-box">
<label>Stage Name</label>
<input type="text" name="Stage Name">
</div>

<div class="input-box">
<label>Date of Birth</label>
<input type="date" name="Date of Birth">
</div>

<div class="input-box">
<label>Age</label>
<input type="number" name="Age">
</div>

<div class="input-box">
<label>Gender</label>
<select name="Gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="input-box">
<label>Mobile Number</label>
<input type="tel" name="Mobile Number" required>
</div>

<div class="input-box">
<label>WhatsApp Number</label>
<input type="tel" name="WhatsApp Number">
</div>

<div class="input-box">
<label>Email Address</label>
<input type="email" name="Email Address" required>
</div>

</div>

<div class="input-box">
<label>Current Address</label>
<textarea name="Current Address"></textarea>
</div>

<div class="row">

<div class="input-box">
<label>City / State</label>
<input type="text" name="City State">
</div>

<div class="input-box">
<label>Nationality</label>
<input type="text" name="Nationality">
</div>

</div>

<!-- PHYSICAL DETAILS -->

<h2>Physical Details</h2>

<div class="row">

<div class="input-box">
<label>Height</label>
<input type="text" name="Height">
</div>

<div class="input-box">
<label>Weight</label>
<input type="text" name="Weight">
</div>

<div class="input-box">
<label>Skin Tone</label>
<input type="text" name="Skin Tone">
</div>

<div class="input-box">
<label>Hair Color</label>
<input type="text" name="Hair Color">
</div>

<div class="input-box">
<label>Eye Color</label>
<input type="text" name="Eye Color">
</div>

<div class="input-box">
<label>Body Type</label>
<input type="text" name="Body Type">
</div>

</div>

<!-- ACTING DETAILS -->

<h2>Acting Details</h2>

<div class="row">

<div class="input-box">
<label>Acting Experience</label>
<input type="text" name="Acting Experience">
</div>

<div class="input-box">
<label>Theatre Experience</label>
<input type="text" name="Theatre Experience">
</div>

<div class="input-box">
<label>Short Films Experience</label>
<input type="text" name="Short Films Experience">
</div>

<div class="input-box">
<label>Feature Film Experience</label>
<input type="text" name="Feature Film Experience">
</div>

<div class="input-box">
<label>Web Series Experience</label>
<input type="text" name="Web Series Experience">
</div>

<div class="input-box">
<label>Languages Known</label>
<input type="text" name="Languages Known">
</div>

<div class="input-box">
<label>Dancing Skills</label>
<input type="text" name="Dancing Skills">
</div>

<div class="input-box">
<label>Singing Skills</label>
<input type="text" name="Singing Skills">
</div>

<div class="input-box">
<label>Fighting / Action Skills</label>
<input type="text" name="Action Skills">
</div>

</div>

<!-- SOCIAL MEDIA -->

<h2>Social Media Details</h2>

<div class="row">

<div class="input-box">
<label>Instagram Profile</label>
<input type="url" name="Instagram">
</div>

<div class="input-box">
<label>Facebook Profile</label>
<input type="url" name="Facebook">
</div>

<div class="input-box">
<label>YouTube Channel</label>
<input type="url" name="YouTube">
</div>

<div class="input-box">
<label>Twitter / X Profile</label>
<input type="url" name="Twitter">
</div>

</div>

<!-- PORTFOLIO -->

<h2>Portfolio Details</h2>

<div class="row">

<div class="input-box">
<label>Upload Headshot</label>
<input type="file" name="Headshot">
</div>

<div class="input-box">
<label>Upload Full Size Photo</label>
<input type="file" name="Full Size Photo">
</div>

<div class="input-box">
<label>Upload Introduction Video</label>
<input type="file" name="Introduction Video">
</div>

<div class="input-box">
<label>Upload Acting Reel</label>
<input type="file" name="Acting Reel">
</div>

<div class="input-box">
<label>Resume / Portfolio PDF</label>
<input type="file" name="Resume PDF">
</div>

</div>

<!-- AUDITION DETAILS -->

<h2>Audition Details</h2>

<div class="row">

<div class="input-box">
<label>Applying For Role</label>
<input type="text" name="Applying For Role">
</div>

<div class="input-box">
<label>Preferred Language</label>
<input type="text" name="Preferred Language">
</div>

<div class="input-box">
<label>Available Dates</label>
<input type="text" name="Available Dates">
</div>

<div class="input-box">
<label>Current Location</label>
<input type="text" name="Current Location">
</div>

<div class="input-box">
<label>Ready To Travel?</label>
<select name="Ready To Travel">
<option>Yes</option>
<option>No</option>
</select>
</div>

</div>

<!-- DECLARATION -->

<h2>Declaration</h2>

<div class="checkbox">
<input type="checkbox" required>
<label>I confirm all details are true.</label>
</div>

<div class="row">

<div class="input-box">
<label>Signature</label>
<input type="text" name="Signature">
</div>

<div class="input-box">
<label>Date</label>
<input type="date" name="Date">
</div>

</div>

<button type="submit">
Submit Application
</button>

</form>

</div>

</body>
</html>
